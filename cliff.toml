# git-cliff configuration
# https://git-cliff.org/docs/configuration

[changelog]
# Template for the changelog body
body = """
{% if version %}\
    ## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim }}
    {% for commit in commits %}
        - {{ commit.message | split(pat="\n") | first | trim }}\
          {% if commit.remote.username %} by @{{ commit.remote.username }}{% endif %}\
          {% if commit.remote.pr_number %} in #{{ commit.remote.pr_number }}{% endif %}\
    {%- endfor %}
{% endfor %}\n
"""
header = ""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
# Tags use plain semver without 'v' prefix
tag_pattern = "[0-9].*"
sort_commits = "newest"

commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
    { message = "^refactor", group = "<!-- 2 -->Refactoring" },
    { message = "^style", group = "<!-- 3 -->Styling" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^chore", group = "<!-- 5 -->Maintenance" },
    { message = "^ci", group = "<!-- 6 -->CI/CD" },
    { message = "^perf", group = "<!-- 7 -->Performance" },
    { message = "^test", group = "<!-- 8 -->Testing" },
    # Catch-all for commits without conventional prefix
    { message = ".*", group = "<!-- 9 -->Other Changes" },
]

[remote.github]
owner = "ramius86"
repo = "btcservermanager"
